name: CI

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  tests:
    name: Test
    runs-on: macOS-15
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Run Tests
        run: xcodebuild -project Relativity.xcodeproj -scheme Relativity -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 16" -configuration Debug -PBXBuildsContinueAfterErrors=0 build test
